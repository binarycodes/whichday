spring.application.name=whichday

# PORT rather than a WHICHDAY_ name: the Dockerfile's healthcheck already probes
# ${PORT:-8080}, and it is what a container platform injects. The OIDC redirect URI is
# built from {baseUrl}, so it follows the port without being told.
server.port=${PORT:8080}

# Behind a TLS-terminating proxy the application only ever sees plain HTTP, so the
# OIDC redirect URI it builds from {baseUrl} would come out as http:// on the wrong
# host — and the provider rejects a redirect URI that is not the registered one.
# Trusting the proxy's X-Forwarded-* headers fixes that, and stays off by default
# because those headers are client-supplied and spoofable with nothing in front.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Signing in is the only way in, and OIDC is the only way to sign in. The
# registration is called "oidc" rather than after the provider behind it: Spring
# builds /oauth2/authorization/oidc and the /login/oauth2/code/oidc callback from
# this id, so a vendor named here would end up in the application's own URLs and in
# every deployment's configuration (CODING_CONVENTIONS.md §10b). Which provider it
# is belongs to the issuer below and to nothing else.
spring.security.oauth2.client.provider.oidc.issuer-uri=${WHICHDAY_OIDC_ISSUER_URI:https://accounts.google.com}
spring.security.oauth2.client.registration.oidc.provider=oidc
spring.security.oauth2.client.registration.oidc.client-id=${WHICHDAY_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.oidc.client-secret=${WHICHDAY_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.oidc.scope=openid,email,profile
# Spring infers the grant type and redirect URI for provider ids it recognises, and
# "oidc" is deliberately not one of them (§10b) — so both are stated here.
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

vaadin.launch-browser=false

logging.level.io.binarycodes.whichday=DEBUG
