spring.application.name=whichday

# PORT rather than a WHICHDAY_ name: the Dockerfile's healthcheck already probes
# ${PORT:-8080}, and it is what a container platform injects. The OIDC redirect URI is
# built from {baseUrl}, so it follows the port without being told.
server.port=${PORT:8080}

# Behind a TLS-terminating proxy the application only ever sees plain HTTP, so the
# OIDC redirect URI it builds from {baseUrl} would come out as http:// on the wrong
# host — and the provider rejects a redirect URI that is not the registered one.
# Trusting the proxy's X-Forwarded-* headers fixes that, and stays off by default
# because those headers are client-supplied and spoofable with nothing in front.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Whichday runs one of two ways, chosen once at deploy time. The variable names the
# profile outright, so the file that carries a mode's configuration is
# application-<mode>.properties and there is nothing mapping one to the other.
#
# The OIDC block lives in application-login.properties rather than here, and it has
# to genuinely live there: Boot resolves an issuer by fetching its discovery document
# at startup, so an anonymous deployment that inherited issuer-uri would hang on a
# provider it has no reason to reach. Blanking the key is not the same thing — that
# fails as "issuer cannot be empty" (CODING_CONVENTIONS.md §11).
#
# Anonymous is the default because it is the mode that needs nothing configured: the
# image runs, the link works, and a deployment that wants accounts opts into them.
spring.profiles.active=${WHICHDAY_ACCESS_MODE:anonymous}

# The whole store is one H2 file the process opens — one container, and nothing else
# to bring up (CODING_CONVENTIONS.md §10, docs/REQUIREMENTS.md §9). MODE=PostgreSQL is
# what keeps the migrations written in SQL a real PostgreSQL would run, so the engine
# is the only thing an instance that outgrows this has to change.
#
# WHICHDAY_DATA_DIR names the directory rather than the whole JDBC URL, so moving the
# file somewhere else cannot drop MODE=PostgreSQL on the way past. The default is the
# local one, the project root; the image sets the variable outright. Only one process
# can open the file, so only ever run one of these.
whichday.database.options=MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:file:${WHICHDAY_DATA_DIR:./data}/whichday;${whichday.database.options}
# Boot defaults these only for an in-memory URL, so a file URL has to say them. There
# is no listener for them to protect: the file is protected by its permissions.
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema (db/migration/V*.sql) and validate fails startup on drift
# rather than rewriting it.
spring.jpa.hibernate.ddl-auto=validate
# Off: a screen holds an immutable record and never an entity, so a lazy read outside
# a transaction is a bug, and this would hide it until the next thing moved.
spring.jpa.open-in-view=false

vaadin.launch-browser=false

# Copilot off. The application is started to be looked at, not edited in the browser:
# its overlay sits on top of the running UI, and its edits write back into the sources
# behind whatever is building them.
#
# It has to be a Spring property and not a -D on the mvn command line. Copilot asks the
# running application's Environment for this key, and `spring-boot:run` forks a second
# JVM for that application — so a -D passed to Maven lands in the wrong process and the
# overlay comes up anyway. Dev mode only; a production build ships no Copilot to
# disable, and the key is inert there.
vaadin.copilot.enable=false

logging.level.io.binarycodes.whichday=DEBUG
