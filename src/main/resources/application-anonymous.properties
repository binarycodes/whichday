# Anonymous mode configures nothing. That is the point of it: no provider, no client,
# no secret — a session says who it is by typing a name, the link is what lets anybody
# see a poll, and a six-digit code is what lets anybody change one.
#
# The absence of a spring.security.oauth2.client.* key here is load-bearing, not an
# omission: see application.properties for why the issuer cannot merely be blanked.

# What the application branches on. The profile decides which file is read; the
# property is what the code asks, so a test is free to compose @ActiveProfiles
# without @Profile on a bean deciding behind its back.
whichday.access.mode=anonymous
