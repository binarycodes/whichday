# What the login mode needs, and nothing else needs.
#
# Signing in is the only way in, and OIDC is the only way to sign in. The
# registration is called "oidc" rather than after the provider behind it: Spring
# builds /oauth2/authorization/oidc and the /login/oauth2/code/oidc callback from
# this id, so a vendor named here would end up in the application's own URLs and in
# every deployment's configuration (CODING_CONVENTIONS.md §10b). Which provider it
# is belongs to the issuer below and to nothing else.
#
# The three defaults are the development stack in environment/dev — the Keycloak
# `./run.sh env up` brings up, its realm, and a client secret that is in version
# control on purpose. They are a laptop's, and they are here so that a fresh checkout
# is `env up` and `run` with nothing to configure in between. A deployment sets all
# three; the README says so and neither sample leaves any of them out.
spring.security.oauth2.client.provider.oidc.issuer-uri=${WHICHDAY_OIDC_ISSUER_URI:http://localhost:8082/realms/whichday}
spring.security.oauth2.client.registration.oidc.provider=oidc
spring.security.oauth2.client.registration.oidc.client-id=${WHICHDAY_OIDC_CLIENT_ID:whichday}
spring.security.oauth2.client.registration.oidc.client-secret=${WHICHDAY_OIDC_CLIENT_SECRET:whichday-dev-secret}
spring.security.oauth2.client.registration.oidc.scope=openid,email,profile

# What the application branches on. The profile decides which file is read; the
# property is what the code asks, so a test is free to compose @ActiveProfiles
# without @Profile on a bean deciding behind its back.
whichday.access.mode=login
