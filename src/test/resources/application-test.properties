# The profile every Spring test names.
#
# A profile can override a key but never remove one, and Boot resolves an issuer by
# fetching its discovery document at startup — so a test that inherited
# provider.oidc.issuer-uri would hang the whole context on accounts.google.com, and
# blanking it fails as "issuer cannot be empty". The registration therefore points at
# a second provider whose endpoints cannot resolve, leaving the inherited issuer
# unreferenced. The registration id stays "oidc", because that is what builds the
# callback path and what SecurityConfig names (CODING_CONVENTIONS.md §11).
spring.security.oauth2.client.registration.oidc.provider=offline
spring.security.oauth2.client.registration.oidc.client-id=test-client
spring.security.oauth2.client.registration.oidc.client-secret=test-secret
spring.security.oauth2.client.provider.offline.authorization-uri=http://offline.invalid/authorize
spring.security.oauth2.client.provider.offline.token-uri=http://offline.invalid/token
spring.security.oauth2.client.provider.offline.user-info-uri=http://offline.invalid/userinfo
spring.security.oauth2.client.provider.offline.jwk-set-uri=http://offline.invalid/jwks
spring.security.oauth2.client.provider.offline.user-name-attribute=sub

logging.level.io.binarycodes.whichday=WARN
