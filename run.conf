# What this project's task runner needs to know about it. run.sh itself is shared
# and names no project, so this file is the only thing a different project edits.
#
# Plain assignments, not `readonly` — run.sh applies its defaults over anything
# left out, so a key only has to appear here when its answer is a decision.

# Named in what the tasks print, so the messages say whose stack came up.
PROJECT_NAME="Whichday"

# The JDK to build with, matched as a prefix against SDKMAN's candidates. A bare
# `mvn` on this machine picks JDK 25, under which Lombok silently generates no
# getters and the build dies with bogus "cannot find symbol" errors.
JAVA_VERSION="21"

# The polls live in an embedded H2 file under WHICHDAY_DATA_DIR, so the development
# stack is one container and it is not the database: signing in is the only way in,
# and the Keycloak in environment/dev is what answers. ENV_DIR and CONTAINER_PREFIX
# are left out because the defaults — environment/dev and whichday-dev — are already
# what this project uses.
CONTAINER_REQUIRED="true"

# The profile that puts the integration tests in production mode.
IT_PROFILE="it"

# A property carrying the deployed commit SHA, passed to every mvn invocation.
# Whichday's enforcer plugin rejects a build without it, which is what makes every
# artefact traceable to a commit.
COMMIT_PROPERTY="build.commit"
