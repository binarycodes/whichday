# The one service Whichday talks to while you are developing it: the identity provider
# it authenticates against. The polls live in an H2 file the application opens itself
# (docs/REQUIREMENTS.md §9), so there is no database here and nothing else to bring up.
#
# Every credential here is published and guessable — admin/admin on the Keycloak
# console, a client secret in version control, and a client that will redirect anywhere
# at all. That is only acceptable because this file is for a laptop: nothing here
# belongs on a machine anyone else can reach. A deployment sets the WHICHDAY_OIDC_*
# trio against a realm of its own.

services:
  # Signing in is the only way into Whichday and OIDC is the only way to sign in, so
  # this is as required as the application itself — it fetches the issuer's discovery
  # document at startup and will not start without it.
  #
  # Started empty. The realm, its client and its people are created afterwards by
  # keycloak-init, over the admin REST API.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: whichday-dev-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The readiness endpoint lives on the management port, and only when asked for.
      KC_HEALTH_ENABLED: "true"
    # 8082, because Keycloak's own default is Whichday's and 8081 — the obvious next
    # one — is where a sibling project's Keycloak already sits on this machine. The
    # management port is not published: only the healthcheck below reaches it, from
    # inside the container.
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/HealthCheck.java:/tmp/HealthCheck.java:ro
    # This image carries no curl and no wget, but it does carry a JVM — so the probe is
    # a single Java source file. It asks /health/ready rather than testing whether a
    # port is open, because Keycloak binds its ports long before it can answer, and
    # keycloak-init below depends on this being true rather than merely started.
    healthcheck:
      test: ["CMD", "java", "/tmp/HealthCheck.java", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the realm, once, and exits. A script against the admin REST API rather
  # than a realm export imported at boot: an export has to be an exactly correct
  # RealmRepresentation or the container refuses to start, and says so through a
  # Jackson field error that names nothing about Keycloak. Here a mistake is an HTTP
  # 400 that names the field. Re-running is safe: each step looks up what it would
  # create and skips it if it is already there.
  keycloak-init:
    image: node:24-alpine
    container_name: whichday-dev-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USERNAME: admin
      KC_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/init.mjs:/tmp/init.mjs:ro
    entrypoint: ["node", "/tmp/init.mjs"]
    # It is meant to exit. Without this, compose restarts a container that has done its
    # job and `up --wait` never settles.
    restart: "no"
